# Opens weekly pull requests to keep dependencies up to date.
# Security updates for known vulnerabilities are opened separately, as soon as they're found.
version: 2
updates:
  # Python packages in requirements*.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only propose releases that are at least 14 days old (same cooldown as our lock files).
    cooldown:
      default-days: 14

  # Actions used in .github/workflows (updates the pinned SHAs and version comments)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
