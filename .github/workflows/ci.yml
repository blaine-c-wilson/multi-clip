# Runs the tests on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported version (see README) and the newest.
        python-version: ["3.12", "3.14"]

    steps:
      # Actions are pinned to a full commit SHA, so a moved or hijacked tag
      # can't change the code that runs here. The comment shows the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        run: pytest

  # Fails if any locked package has a known vulnerability.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Audit dependencies
        run: pip-audit --strict --disable-pip -r requirements-dev.txt

  # Builds the container image, checks that it starts, and scans it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build -t multi-clip:ci .

      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 multi-clip:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      # Fails on HIGH or CRITICAL vulnerabilities that have a fix available.
      # Trivy runs from its official image, pinned to a digest (update by hand;
      # Dependabot doesn't see images referenced in run steps).
      - name: Scan image with Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 multi-clip:ci

      # Hand the tested image to the publish job, so the exact same image is published.
      - name: Save image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save multi-clip:ci | gzip > image.tar.gz

      - name: Upload image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  # Publishes the image to Amazon ECR. Runs only for pushes to main, after every
  # check has passed. The AWS key lives in the "production" environment, which
  # only main can use, so workflows on other branches can't read it.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, audit, image]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Tagged with the commit SHA, so every image traces back to exact code.
      - name: Push image to ECR
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${REPOSITORY%%/*}"
          docker tag multi-clip:ci "$REPOSITORY:$GITHUB_SHA"
          docker push "$REPOSITORY:$GITHUB_SHA"
