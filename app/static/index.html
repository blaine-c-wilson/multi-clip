<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>multi-clip</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    /* 1em is the heading's font size, so the logo matches the text height. */
    h1 img { height: 1em; vertical-align: middle; }
    textarea { width: 100%; min-height: 5rem; box-sizing: border-box; font: inherit; }
    button { font: inherit; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem; margin-bottom: 0.5rem; }
    /* Every other clip gets a 10% gray background (10% black, 90% white), starting with the top one. */
    li:nth-child(odd) { background: #e6e6e6; }
    li pre { white-space: pre-wrap; margin: 0 0 0.5rem; font: inherit; }
    li img { display: block; max-width: 100%; max-height: 20rem; margin-bottom: 0.5rem; }
    #new-image { margin: 0.5rem 0 1rem; }
    /* Shown while an image is dragged over the text box. */
    textarea.dropping { outline: 3px dashed #2f6fdf; background: #eef3fd; }
    .meta { color: #666; font-size: 0.85rem; }
    kbd { font: inherit; border: 1px solid #ccc; border-radius: 4px; padding: 0 0.3em; }
  </style>
</head>
<body>
  <!-- alt="" because the logo is decoration; the heading text already says the name. -->
  <h1>multi-clip <img src="/favicon.svg" alt=""></h1>

  <form id="new-clip">
    <textarea id="text" placeholder="Paste or type a clip, or drop an image here..." required></textarea>
    <button type="submit">Save clip</button>
  </form>

  <form id="new-image">
    <label>Or add an image (PNG, JPEG, GIF or WebP, up to 5 MB; you can also paste or drop one):
      <input type="file" id="image" accept="image/png,image/jpeg,image/gif,image/webp">
    </label>
  </form>

  <ul id="clips"></ul>

  <script>
    const list = document.getElementById("clips");
    // Copy buttons of the clips on screen, top first, for the keyboard shortcuts.
    let copyButtons = [];

    // Fetch all clips from the API and redraw the list.
    async function loadClips() {
      const response = await fetch("/api/clips");
      const clips = await response.json();
      list.innerHTML = "";
      copyButtons = [];
      for (const clip of clips) {
        const item = document.createElement("li");

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = new Date(clip.created_at).toLocaleString() + " ";

        const copy = document.createElement("button");
        copy.textContent = "Copy";

        let content;
        if (clip.kind === "image") {
          content = document.createElement("img");
          content.src = `/api/clips/${clip.id}/image`;
          content.alt = "Image clip";
          copy.onclick = () => { copyImage(content.src); copied(copy); };
          meta.textContent += `(deleted ${new Date(clip.expires_at).toLocaleDateString()}) `;
        } else {
          // textContent (not innerHTML) so clip text is never run as HTML.
          content = document.createElement("pre");
          content.textContent = clip.text;
          copy.onclick = () => { navigator.clipboard.writeText(clip.text); copied(copy); };
        }

        const remove = document.createElement("button");
        remove.textContent = "Delete";
        remove.onclick = async () => {
          await fetch(`/api/clips/${clip.id}`, { method: "DELETE" });
          loadClips();
        };

        meta.append(copy, " ", remove);
        copyButtons.push(copy);
        if (copyButtons.length <= 5) {
          const shortcut = document.createElement("kbd");
          shortcut.textContent = `⌘⌥${copyButtons.length}`;
          shortcut.title = `Press Cmd+Option+${copyButtons.length} to copy this clip`;
          meta.append(" ", shortcut);
        }
        item.append(content, meta);
        list.append(item);
      }
    }

    document.getElementById("new-clip").onsubmit = async (event) => {
      event.preventDefault();
      const textBox = document.getElementById("text");
      await fetch("/api/clips", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: textBox.value }),
      });
      textBox.value = "";
      loadClips();
    };

    // Show that a copy happened, which matters when it came from the keyboard.
    function copied(button) {
      button.textContent = "Copied!";
      setTimeout(() => (button.textContent = "Copy"), 1000);
    }

    // Cmd+Option+1 to 5 copy the top five clips. event.code names the key
    // itself ("Digit1"), because with Option held event.key is a symbol like "¡".
    document.addEventListener("keydown", (event) => {
      const digit = event.code.match(/^Digit([1-5])$/);
      if (digit && event.metaKey && event.altKey && !event.shiftKey && !event.ctrlKey) {
        event.preventDefault();
        copyButtons[digit[1] - 1]?.click();
      }
    });

    // The clipboard only takes PNG images everywhere, so redraw other
    // formats as PNG. Safari needs the image handed over as a promise.
    function copyImage(url) {
      const png = fetch(url)
        .then((response) => response.blob())
        .then(createImageBitmap)
        .then((bitmap) => {
          const canvas = document.createElement("canvas");
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          canvas.getContext("2d").drawImage(bitmap, 0, 0);
          return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
        });
      navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
    }

    // Three steps: ask the app for a signed form, send the image straight to
    // S3 with it (Lambda can't take big uploads), then tell the app it's there.
    async function saveImage(file) {
      if (file.size > 5 * 1024 * 1024) return alert("Images can be up to 5 MB.");
      let response = await fetch("/api/uploads", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content_type: file.type }),
      });
      if (!response.ok) return alert((await response.json()).detail);
      const upload = await response.json();

      const form = new FormData();
      for (const [name, value] of Object.entries(upload.fields)) form.append(name, value);
      form.append("file", file); // S3 needs the file after the other fields
      response = await fetch(upload.url, { method: "POST", body: form });
      if (!response.ok) return alert("The image upload failed.");

      response = await fetch("/api/image-clips", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: upload.id }),
      });
      if (!response.ok) return alert((await response.json()).detail);
      loadClips();
    }

    const picker = document.getElementById("image");
    picker.onchange = async () => {
      await saveImage(picker.files[0]);
      picker.value = "";
    };

    // Dropping images on the text box saves them, like pasting.
    const dropZone = document.getElementById("text");
    dropZone.addEventListener("dragover", (event) => {
      if (event.dataTransfer.types.includes("Files")) {
        event.preventDefault(); // without this the browser won't allow a drop
        dropZone.classList.add("dropping");
      }
    });
    dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dropping"));
    dropZone.addEventListener("drop", async (event) => {
      dropZone.classList.remove("dropping");
      if (!event.dataTransfer.types.includes("Files")) return; // dropped text goes in the box
      // Otherwise the browser would leave the page to open the file.
      event.preventDefault();
      const files = [...event.dataTransfer.files];
      const images = files.filter((f) => f.type.startsWith("image/"));
      if (images.length < files.length) alert("Only images can be dropped here.");
      for (const file of images) await saveImage(file);
    });

    // Pasting an image anywhere on the page (e.g. a screenshot) saves it.
    document.addEventListener("paste", (event) => {
      const file = [...event.clipboardData.files].find((f) => f.type.startsWith("image/"));
      if (file) {
        event.preventDefault();
        saveImage(file);
      }
    });

    loadClips();
  </script>
</body>
</html>
